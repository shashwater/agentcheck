name: agentcheck
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_all.py
      - run: python3 -m agentcheck.cli run --agent "python3 agents/v2_hardened.py" --name candidate --out runs/candidate.json
      - run: python3 -m agentcheck.cli compare runs/v2_hardened.json runs/candidate.json
